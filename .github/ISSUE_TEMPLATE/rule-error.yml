name: 报告规则错误
description: 某条规则在特定事实组合下给出了错误结果
title: "[规则] "
labels: ["rule-error"]
body:
  - type: markdown
    attributes:
      value: |
        ## 请勿提交敏感材料

        **请勿提交公司名称、姓名、身份证号、聊天记录、劳动合同、
        解除通知、源代码、客户信息或其他敏感材料。**

        用匿名化的事实结构描述即可，例如
        「深圳，协商延长 7 个月，延长期已届满，本人书面表达过续订意愿」。

  - type: input
    id: rule_id
    attributes:
      label: Rule ID
      description: 在结果页展开「查看规则依据」可以看到，例如 CN-SZ-HARMONIOUS-LABOR-18-2
      placeholder: CN-...
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 工具版本 / 规则集版本
      description: 在 Case Export 顶部可以看到
      placeholder: "tool 0.1.0 / ruleset 2026-09-04"
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: 匿名化的事实组合
      description: 只写影响定性的结构性事实，不要贴原始文件
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你认为正确的结果是什么，依据是什么
      description: 请写明条文、司法解释或地方规定
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我确认本 Issue 中不含公司名称、姓名、聊天记录、合同原文或源代码
          required: true
