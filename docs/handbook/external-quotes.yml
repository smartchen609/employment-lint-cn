# 手册引文中不在 docs/law-corpus/ 汇编里的部分
#
# tests/handbook-quotes.test.ts 要求：手册（含草稿）里每一段 `>` 引用的法条原文，
# 要么能在维护人汇编中逐字找到，要么登记在这里并指向 sources.yml 中的来源。
# 这里的文本均取自已由维护人核验的官方页面（court.gov.cn 等）。
#
# source_id 为 PROJECT-COPY 的是本项目自己的文案（rules/copy/），不是法条。

quotes:
- source_id: SPC-LABOR-II-2025
  text: 有下列情形之一的，人民法院应认定为符合劳动合同法第十四条第二款第三项"连续订立二次固定期限劳动合同"的规定：
- source_id: SPC-LABOR-II-2025
  text: （一）用人单位与劳动者协商延长劳动合同期限累计达到一年以上，延长期限届满的；
- source_id: SPC-LABOR-II-2025
  text: （二）用人单位与劳动者约定劳动合同期满后自动续延，续延期限届满的；
- source_id: SPC-LABOR-II-2025
  text: （三）劳动者非因本人原因仍在原工作场所、工作岗位工作，用人单位变换劳动合同订立主体，但继续对劳动者进行劳动管理，合同期限届满的；
- source_id: SPC-LABOR-II-2025
  text: （四）以其他违反诚信原则的规避行为再次订立劳动合同，期限届满的。
- source_id: SPC-LABOR-II-2025
  text: 劳动合同期满后，劳动者仍在用人单位工作，用人单位未表示异议超过一个月，劳动者请求用人单位以原条件续订劳动合同的，人民法院依法予以支持。
- source_id: SPC-LABOR-II-2025
  text: 符合订立无固定期限劳动合同情形，劳动者请求用人单位以原条件订立无固定期限劳动合同的，人民法院依法予以支持。
- source_id: SPC-LABOR-II-2025
  text: 用人单位解除劳动合同，劳动者请求用人单位依法承担解除劳动合同法律后果的，人民法院依法予以支持。
- source_id: CN-CIVIL-CODE-2021
  text: 按照年、月计算期间的，到期月的对应日为期间的最后一日；
- source_id: CN-CIVIL-CODE-2021
  text: 没有对应日的，月末日为期间的最后一日。
- source_id: SPC-GUIDING-CASE-183
  text: 年终奖发放前离职的劳动者主张用人单位支付年终奖的，人民法院应当结合劳动者的离职原因、离职时间、工作表现以及对单位的贡献程度等因素进行综合考量。
- source_id: SPC-GUIDING-CASE-183
  text: 用人单位的规章制度规定年终奖发放前离职的劳动者不能享有年终奖，但劳动合同的解除非因劳动者单方过失或主动辞职所导致，且劳动者已经完成年度工作任务，用人单位不能证明劳动者的工作业绩及表现不符合年终奖发放标准，年终奖发放前离职的劳动者主张用人单位支付年终奖的，人民法院应予支持。
- source_id: PROJECT-COPY
  text: 只保存与本人劳动关系、岗位、绩效和解除事实具有必要关联的材料。
- source_id: PROJECT-COPY
  text: 不要绕过权限控制，不要使用他人账号，不要批量复制源代码、客户数据、模型权重、密钥、商业秘密或与案件无关的公司文件。
- source_id: PROJECT-COPY
  text: 证据固定不等于可以无限制下载公司数据。
- source_id: SPC-LABOR-II-2025
  text: 劳动者未知悉、接触用人单位的商业秘密和与知识产权相关的保密事项，劳动者请求确认竞业限制条款不生效的，人民法院依法予以支持。
- source_id: SPC-LABOR-II-2025
  text: 竞业限制条款约定的竞业限制范围、地域、期限等内容与劳动者知悉、接触的商业秘密和与知识产权相关的保密事项不相适应，劳动者请求确认竞业限制条款超过合理比例部分无效的，人民法院依法予以支持。
- source_id: SPC-LABOR-I-2020
  text: 在竞业限制期限内，用人单位请求解除竞业限制协议的，人民法院应予支持。
- source_id: SPC-LABOR-II-2025
  text: 劳动者违反有效的竞业限制约定，用人单位请求劳动者按照约定返还已经支付的经济补偿并支付违约金的，人民法院依法予以支持。
- source_id: SPC-LABOR-II-2025
  text: 用人单位与高级管理人员、高级技术人员和其他负有保密义务的人员约定在职期间竞业限制条款，劳动者以不得约定在职期间竞业限制、未支付经济补偿为由请求确认竞业限制条款无效的，人民法院不予支持。
