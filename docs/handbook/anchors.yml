# 维护人已确认的关键内容锚点
#
# tests/handbook-content.test.ts 要求：每个锚点字符串必须出现在对应的已发布章节里；
# 若 docs/handbook/drafts/ 下有同名修订稿，修订稿里也必须保留全部锚点。
#
# 为什么要有这个文件：2026-09-09 我用字符串替换改 03 节时，有三处替换没找到原文、
# 静默跳过，而我当时报告"已落地"并部署上线（见 CHANGELOG 2026-09-16）。
# 锚点让"维护人确认过的内容被改丢"这件事变成测试失败，而不是靠人发现。
#
# 只登记维护人在对话中明确确认过的内容，不登记草稿。

