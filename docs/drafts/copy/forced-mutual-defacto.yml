# 【草稿】被迫解除入口 C23–C29、协商解除 C30、事实解除 C31 的结果卡片与证据清单
#
# 维护人确认前不进 rules/copy/，不上线（CLAUDE.md §L2、§1b.6）。
# 文字一律取自维护人 2026-09-09 已审定的手册第 03、07、08 节，
# 或 rules/copy/ 里已有的规格书文案；每段后注明出处，方便逐条对照。
#
# 卡片顺序即同等严重程度时的展示优先级（resolve.ts 的并列排序规则）：
# 先是「会让被迫解除直接走不通」的程序和地方口径，最后才是「存在这条路」。

templates:
  - id: "C23"
    title: "被迫解除的程序风险：离开时没有说明是因为公司过错而解除"
    rule_ids:
      - "CN-GD-FORCED-RESIGNATION-REASON-NOT-STATED"
    body:
      # 03「常见误解」
      - "走的时候没说是因为欠薪走的，事后主张被迫解除，多数不会被支持。"
      - "写了「个人原因」，就是普通辞职。事后改口很难。"
      # 03「实务分歧」一，深圳指引第八十一条第二款但书
      - >
        深圳中院裁判指引留有一个例外：劳动者有证据证明其解除劳动合同确实是因用人单位
        存在《劳动合同法》第三十八条第一款情形的除外。
    # C02 规格书文案
    primary_warning: >
      不要在没有审查原文件的情况下，再提交一份新的辞职说明、确认书或补充协议。
      追加文件可能进一步固化不利表述。
    sections:
      - heading: "现在需要固定"
        items:
          # 03「你现在该做什么」第 7 步、07 第三节
          - "你发出的被迫解除通知及送达凭证（EMS 单号、邮件发送记录、微信截图带时间）"
          - "向公司催要工资的书面记录"
          - "离职前后与公司的全部沟通记录"
      - heading: "为什么这样提示"
        paragraphs:
          # 03「实务分歧」一
          - "深圳中院在配套《说明》里讲了三种不支持的情况：辞职时说的是别的理由，事后改口说是被迫；辞职时没说理由，事后说是被迫；不告而别，事后说是被迫。"

  - id: "C24"
    title: "深圳：以社保没交为由被迫解除，要先书面催缴，等满一个月"
    rule_ids:
      - "CN-SZ-COURT-94-DEMAND-SOCIAL-INSURANCE-FIRST"
    body:
      # 03「实务分歧」二
      - "在深圳，社保没交不能直接被迫解除，要先书面要求公司缴，公司一个月内还不缴，才可以。"
      - "只有缺险种（比如只交了养老没交医疗）或者完全没缴的，才可以先催缴一个月、再被迫解除。"
    # 03「常见误解」「你现在该做什么」第 3 步
    primary_warning: >
      不要一发现社保没交就马上发被迫解除通知。在深圳要先催：先发催缴通知，等一个月；一个月后公司还没缴，再发被迫解除通知。
    sections:
      - heading: "按顺序"
        items:
          # 03「你现在该做什么」第 3、4、7 步
          - "先发书面催缴通知，用能留痕的方式发，保存发送凭证"
          - "等满一个月，自行查询社保缴费记录"
          - "一个月后公司还没缴，再发被迫解除通知，写明依据《劳动合同法》第三十八条第一款第（三）项"

  - id: "C25"
    title: "深圳：社保基数没交够，现行实践不作被迫解除理由"
    rule_ids:
      - "CN-SZ-PRACTICE-SOCIAL-INSURANCE-UNDERPAID-NOT-A-GROUND"
    body:
      # 03「实务分歧」二
      - "以前「未足额缴纳」（交了但基数不够）催缴一个月后也可以被迫解除；现在不行了。"
      - "只有缺险种（比如只交了养老没交医疗）或者完全没缴的，才可以先催缴一个月、再被迫解除。"
    primary_warning: >
      不要以社保基数没交够为由被迫解除。基数没交够的，走投诉或补缴的路，不走被迫解除。
    sections:
      - heading: "不确定性"
        paragraphs:
          - "这是维护人 2026 年 9 月确认的现行变化，属于司法实践，没有单独的文件依据。"

  - id: "C26"
    title: "深圳：二倍工资、年假工资、高温津贴不能作被迫解除理由"
    rule_ids:
      - "CN-SZ-COURT-92-EXCLUDED-ARREARS"
    body:
      # 03「常见误解」「实务分歧」三
      - "深圳指引第九十二条明确排除了这三项。"
      - "这三样可以单独去要，但不能拿它们当「未及时足额支付劳动报酬」来被迫解除。"
    primary_warning: >
      不要拿二倍工资、年假工资、高温津贴没付当被迫解除的理由。想以欠薪被迫解除的，得是正常工资或加班费被拖欠。
    sections: []

  - id: "C27"
    title: "紧迫性风险：拿很久以前的欠款主张被迫解除"
    rule_ids:
      - "CN-PRACTICE-FORCED-RESIGNATION-URGENCY"
    body:
      # 03「实务分歧」四
      - "越来越多的裁审机关会看被迫性和紧迫性——你是不是真的因为这笔欠款干不下去了，还是拿一笔陈年旧账当由头走人。"
      - "一笔两三年前的欠款，当时没提，现在拿来被迫解除，这类情况下主张被迫解除要经济补偿，很可能不被支持。"
    primary_warning: >
      不要拿一笔陈年旧账当被迫解除的由头。要钱可以，但走投诉或单独主张的路，不走被迫解除。
    sections:
      - heading: "用在你身上"
        paragraphs:
          - "如果你想以欠薪被迫解除，最好是近期的、实打实的、你已经催过的欠薪。陈年旧账另案处理。"
      - heading: "不确定性"
        paragraphs:
          - "这是近一两年争议最多的一点，网上能搜到两种相反的答案。这里写的是维护人依司法实践作出的判断，没有单独的文件依据。"

  - id: "C28"
    title: "还没走：被迫解除通知要在离职前或离职当时送到公司"
    rule_ids:
      - "CN-GD-FORCED-RESIGNATION-STATE-REASON-WHEN-LEAVING"
    body:
      # 03「实务分歧」五「小结」
      - "这条路的实体门槛不高——公司确实欠薪就够了。难在程序：走之前要说清楚为什么走、要留下证据。"
      - "大多数栽跟头的人不是败在「公司没欠薪」，而是败在「走的时候没说」。"
    # 03「你现在该做什么」第 6 步
    primary_warning: >
      不要在任何离职文件上写「个人原因」。公司让你填离职表，理由栏写「依第三十八条被迫解除」，或者不填。
    sections:
      - heading: "你现在该做什么"
        items:
          # 03「你现在该做什么」第 4、5、7 步
          - "走之前，发书面的被迫解除通知。写明：依据《劳动合同法》第三十八条第一款第（几）项，因公司（欠薪/缺险种或未缴社保）的事实，解除劳动合同。"
          - "通知发出去之后再走。顺序反了，程序要件就没了。"
          - "保存发送凭证。EMS 单号、邮件发送记录、微信截图带时间。"

  - id: "C29"
    title: "当前存在：以公司欠薪或未缴社保为由被迫解除的候选"
    rule_ids:
      - "CN-NAT-LCL-38-FORCED-RESIGNATION-GROUNDS"
    body:
      # 03「法律怎么规定」一、二
      - "公司有过错在先，你可以主动解除。最常见的是第（二）项欠工资、第（三）项不交社保。"
      - "你按第三十八条解除，公司要给经济补偿。这就是「被迫解除」和「普通辞职」的区别。"
    # 03「这一节说什么」「法律怎么规定」一
    primary_warning: >
      不要不告而别。欠工资、不交社保不在「可以立即解除、不需事先告知」的那一款里——走这条路，你需要告知公司。
    sections:
      - heading: "先想清楚"
        paragraphs:
          # 03「你现在该做什么」第 1、2 步
          - "先算清楚公司到底欠了什么、欠了多久。工资条、银行流水、社保缴费记录，一样样对。"
          - "想清楚你是想要钱不想走，还是想走。想要钱不想走，去投诉或申请支付令；想走，才是被迫解除这条路。"

  - id: "C30"
    title: "公司让你写「个人原因」：会把协商解除改写成辞职"
    rule_ids:
      - "CN-NAT-LCL-36-37-PERSONAL-REASON-REWRITE"
    body:
      # 08「法律怎么规定」二、「常见误解」
      - "公司让你「写个辞职信走流程」，就是把协商解除变成辞职。一句「个人原因」，经济补偿就没了。"
      - "协商解除的协议里不需要你写「辞职」。"
    # C01 规格书文案
    primary_warning: >
      不要为了配合公司流程而提交「个人原因辞职」。
      个人辞职、公司提出协商解除和公司单方解除，是三种不同的法律事实。
    sections:
      - heading: "你现在该做什么"
        items:
          # 08「你现在该做什么」协商解除第 1、2、4、6 步
          - "什么都先别签。拿回去看。"
          - "保存公司最初提出解除的记录。邮件、聊天、会议纪要——这证明是公司先提的。"
          - "协议里不写「个人原因」「自愿辞职」。写「协商一致解除」。"
          - "每一版草案都留着。谁改了什么，能看出谈判过程。"

  - id: "C31"
    title: "公司不让你干了，你还没有书面表态"
    rule_ids:
      - "CN-NAT-DEFACTO-NO-WRITTEN-WILLINGNESS"
    body:
      # 08「法律怎么规定」三
      - "公司不安排工作，你就不去了、也不吭声——时间一长，很容易被说成「你自己不来了」。"
      - "如果认定是你自己不来了，那就是你旷工或者辞职，公司不用给任何东西。"
    # 08「常见误解」「你现在该做什么」事实解除第 1、4 步
    primary_warning: >
      不要在家等着不说话，也不要自己写辞职。等着不说话，容易被认定为你自己不来。书面表态，现在就发。
    sections:
      - heading: "你现在该做什么"
        items:
          # 08「你现在该做什么」事实解除第 1、2、5 步
          - "用邮件或企业 IM，措辞克制：我仍愿意按照劳动合同正常提供劳动，请公司明确劳动关系状态并安排工作。"
          - "记录每一个动作的时间。账号什么时候关的、哪天被移出群、哪天开始没工资。截图带时间。"
          - "如果公司口头说了「不用来了」，让它写下来。"

checklists:
  # 07「四类情形的证据清单」三，逐行照搬
  - id: "P05"
    title: "被迫解除与欠薪"
    currently_available:
      - "劳动合同中的工资约定"
      - "银行流水（发放主体、金额、日期）"
      - "工资条、个税 App 里的收入记录"
      - "社保、公积金缴费记录（可自行查询）"
      - "打卡截图、加班安排的聊天记录"
      - "你发出的被迫解除通知及送达凭证"
      - "向公司催要工资的书面记录"
    at_risk_after_exit:
      - "公司内部的工资核算表"
      - "工资系统中的应发明细"
      - "考勤系统原始数据"
      - "加班审批流程记录"
      - "门禁、工位系统记录"
      - "公司收到通知后的内部处理记录"

# 草稿终点 → 已发布手册章节（只能指向已发布章节）
endpoints:
  C23: ["03", "07", "11"]
  C24: ["03", "11"]
  C25: ["03", "11"]
  C26: ["03", "11"]
  C27: ["03", "11"]
  C28: ["03", "07", "11"]
  C29: ["03", "07", "11"]
  C30: ["08", "11"]
  C31: ["08", "07", "11"]
