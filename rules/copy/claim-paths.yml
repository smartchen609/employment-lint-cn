# 主张路径输出模板 R01–R06
#
# 全部照抄规格书 round2 §8。**不得新增规格书之外的输出文案。** CLAUDE.md §L2。
#
# round2 §3.4 第四条护栏：主张选择必须放在结果生成之前 ——
# 第四十八条是两种**替代性**法律后果，不是可以累加的两笔给付。

templates:
  - id: "R01"
    title: "当前主张方向候选：要求继续履行劳动合同"
    findings:
      - "CONTINUE_PERFORMANCE_DIRECTION"
    body:
      - "你表示希望回原单位继续工作，当前也未发现明确的客观不能继续履行情形。"
      - "如果最终认定公司违法解除或终止，可以重点评估："
    primary_warning: >
      不要把继续履行和 2N 赔偿金当作两笔可以同时累加的最终给付。
    sections:
      - heading: "可以重点评估"
        items:
          - "请求继续履行劳动合同"
          - "请求支付违法解除或终止后至实际恢复履行前的期间工资"
          - "采取能够证明你持续愿意提供劳动的合理行动"
      - heading: "为什么不应主张什么"
        items:
          - "不要把继续履行和 2N 赔偿金当作两笔可以同时累加的最终给付"
          - "不要只主张 N 后，再默认裁审机构会自动改判继续履行"
          - "不要在主张继续履行的同时，以长期沉默、明确拒绝复工或建立严重冲突的新劳动关系制造相反事实"
      - heading: "不确定性"
        paragraphs:
          - "继续履行还取决于合同是否已经客观不能履行以及程序中的现实变化。"

  - id: "R02"
    title: "当前主张方向候选：违法解除或终止赔偿金"
    findings:
      - "DAMAGES_DIRECTION"
    body:
      - >
        你明确表示不希望回原单位继续工作。
        如果最终能够证明公司违法解除或违法终止，
        当前应重点评估劳动合同法第八十七条赔偿金路径。
    primary_warning: >
      不要因为公司已经支付 N，就把案件只写成普通经济补偿。
    sections:
      - heading: "为什么不应主张什么"
        items:
          - "不要因为公司已经支付 N，就把案件只写成普通经济补偿"
          - "不要把 N 和 2N 作为两笔可以同时累计的最终金额"
          - "如果公司已经支付部分经济补偿，通常需要进一步核对主张赔偿金全额还是差额，而不是重复计算"
          - "不要把\"公司不续签\"直接等同于违法终止，必须先完成合同次数和续订义务判断"

  - id: "R03"
    title: "当前不建议立即固定仲裁请求"
    findings:
      - "REMEDY_DIRECTION_NOT_YET_FIXED"
    body:
      - "你尚未决定是否希望恢复劳动关系。"
      - "这不是形式问题，而是违法解除或终止后的核心法律后果选择。两条路径会影响："
    primary_warning: >
      除非时效已经非常紧迫，不要仅为了"先立案"而随意填写 N、2N 或继续履行。
      先完成专业复核并确定真实目标。若时效临近，应同时优先处理时效问题。
    sections:
      - heading: "两条路径会影响"
        items:
          - "仲裁请求"
          - "事实陈述"
          - "后续就业安排"
          - "是否持续表达工作意愿"
          - "证据准备方向"

  - id: "R04"
    title: "当前诉请与本次预检方向基本一致"
    findings: []
    body:
      - "你已经提交的核心请求与当前定性候选和个人目标没有明显冲突。"
    primary_warning: >
      不要因为本工具出现新的次要 Finding，就自行反复提交补充申请。
    sections:
      - heading: "仍需注意"
        items:
          - "保存仲裁申请书、收件回执、受理通知和全部补正材料"
          - "记录是否已经开庭以及庭审中是否变更、放弃过请求"
          - "不要因为本工具出现新的次要 Finding，就自行反复提交补充申请"
          - "本工具不能判断请求金额、计算口径和现有证据是否完整"

  - id: "R05"
    title: "程序 Warning：现有诉请可能已经固定了不同法律路径"
    findings: []
    body:
      - "你已经提交的请求与当前定性候选或真实目标可能不一致。例如："
    primary_warning: >
      不要未经审查就口头放弃原请求、重新提交另一份申请，
      或者假设仲裁机构会自动替你选择正确法律后果。
    sections:
      - heading: "可能的不一致"
        items:
          - "可能属于违法终止，但只主张了经济补偿"
          - "希望继续履行，但只主张赔偿金"
          - "已要求继续履行，之后又明确表示不愿复工"
          - "已经开庭后才发现新的独立请求"
      - heading: "当前建议"
        paragraphs:
          - "立即导出报告，并结合程序阶段、原申请书、庭审记录和时效进行专业复核。"

  - id: "R06"
    title: "时效 Warning：解除或终止距今可能已经超过一年"
    findings:
      - "ARBITRATION_LIMITATION_RISK"
    body:
      - >
        劳动争议仲裁的一般时效为一年，
        但书面向对方主张权利、向有关部门请求救济或者对方同意履行，可能导致时效中断；
        不可抗力或其他正当理由还可能涉及中止。
    primary_warning: >
      本工具不会仅按日期宣布你的请求已经失效，
      也不会因为你曾经口头沟通过就自动认定时效中断。
    sections:
      - heading: "现在需要固定"
        items:
          - "每次向公司主张权利的日期和原文"
          - "邮件、微信、工单、投诉或调解记录"
          - "公司答复或者承诺支付的记录"
          - "仲裁申请和收件凭证"
      - heading: "处理顺序"
        paragraphs:
          - "时效问题应当优先于其他争点处理。"
