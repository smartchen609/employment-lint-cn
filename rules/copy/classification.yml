# 定性终点输出模板 C00–C22
#
# 全部照抄规格书：C00–C19 来自 round2 §7，C20–C22 来自 round3 §5。
# **不得新增规格书之外的输出文案。** CLAUDE.md §L2。
#
# 与原文的偏离一律写进 deviation_note，并在 docs/open-questions.md 留档。

templates:
  - id: "C00"
    title: "操作尚未完成：现在是证据窗口，不是结论窗口"
    findings: []
    body:
      - "公司目前尚未完成解除或终止操作，因此本工具不能判断最终会采用哪一种法律路径。"
      - "现阶段最有价值的事情不是先计算 N 或 2N，而是把下列内容固定为书面记录："
    primary_warning: >
      不要先提交"个人原因辞职"，也不要只用口头方式表达续订或继续工作的意愿。
      一旦公司正式作出操作，早期形成的文字可能直接影响解除主体、解除理由和举证方向。
    sections:
      - heading: "现在应当固定为书面记录"
        items:
          - "你是否愿意续订或继续工作"
          - "公司所称岗位、团队或业务发生了什么变化"
          - "公司是否提出过具体调岗方案"
          - "双方谈的是岗位变更，还是只谈补偿和离职日期"
      - heading: "下一步"
        paragraphs:
          - "在下一次回复、签字或交还设备前，先完成证据固定清单并导出本报告。"

  - id: "C01"
    title: "当前更接近：公司提出协商解除，劳动关系尚未因该提议自动结束"
    findings: []
    body:
      - "公司提出补偿方案、离职日期或者协议草案，本身不等于你已经同意解除。"
      - "在你签署协商解除协议、提交个人辞职或者以其他方式明确接受前，当前仍处于谈判阶段。"
    primary_warning: >
      不要为了配合公司流程而提交"个人原因辞职"。
      个人辞职、公司提出协商解除和公司单方解除，是三种不同的法律事实。
      文件中的一句话，可能改变后续主张基础。
    sections:
      - heading: "目前不建议做"
        items:
          - "不要把公司报价自动理解为法定应得金额"
          - "不要签署包含\"双方再无任何争议\"的文件后再期待工具自动恢复原有路径"
          - "不要只保存最终协议，忽略公司最初提出解除的聊天和邮件"

  - id: "C02"
    title: "自动判断已暂停：你签署或提交的文件可能已经改变解除性质"
    findings: []
    body:
      - "你已经签署协商解除协议、提交个人辞职，或者无法确认自己签署文件的性质。"
      - "此时不能仅根据公司此前做过什么来判断。需要同时审查："
    primary_warning: >
      不要在没有审查原文件的情况下，再提交一份新的辞职说明、确认书或补充协议。
      追加文件可能进一步固化不利表述。
    sections:
      - heading: "需要同时审查"
        items:
          - "文件标题和全部正文"
          - "谁先提出解除"
          - "签署过程"
          - "是否存在欺诈、胁迫或重大误解"
          - "款项是否已经支付"
          - "双方是否已经实际履行"
          - "文件是否包含放弃权利或无争议条款"
      - heading: "当前建议"
        paragraphs:
          - "先保留全部版本及签署过程记录，并使用 Case Export 向专业人士说明签署前后的完整时间线。"

  - id: "C03"
    title: "当前存在：事实解除候选"
    findings: []
    body:
      - >
        你没有收到清晰的书面解除通知，但公司已经实施了部分拒绝用工行为，
        例如关闭权限、停止安排工作、禁止进入办公场所、停发工资或明确要求你不再到岗。
      - >
        单一的账号关闭、移出群聊或者设备回收，不必然等于已经解除；
        需要结合多项行为、发生时间、公司表态以及你是否继续表达工作意愿综合判断。
    primary_warning: >
      不要因为公司不安排工作，就自行停止到岗并长期保持沉默。
      如果条件允许，应当以合法、克制的书面方式表明：
      我仍愿意按照劳动合同正常提供劳动，请公司明确劳动关系状态并安排工作。
    sections:
      - heading: "当前定性"
        paragraphs:
          - "`事实解除`应当作为候选保留，但现有信息不足以直接认定已经发生违法解除。"

  - id: "C04"
    title: "当前更接近：普通固定期限合同到期终止"
    findings: []
    body:
      - >
        在本工具覆盖范围内，暂未发现已经实际或视同连续订立二次固定期限合同的明确依据，
        也未发现依法必须续延的特殊状态。
      - >
        如果公司没有提出以维持或提高原合同条件续订，或者提出的是降低条件的续订方案，
        普通到期终止可能产生经济补偿问题。
    primary_warning: >
      普通到期终止不等于违法终止，也不能仅因公司不再续签就直接主张 2N。
    sections:
      - heading: "当前不支持的主张"
        paragraphs:
          - "仅凭\"公司不续签\"这一事实，当前不足以支持违法终止赔偿金候选。"
      - heading: "仍需核对是否遗漏"
        items:
          - "自动续延条款"
          - "协商延长期限"
          - "变更签约主体"
          - "到期后继续工作"
          - "劳动者已经提出续订"

  - id: "C05"
    title: "当前存在：到期终止不支付经济补偿的候选"
    findings: []
    body:
      - >
        在未触发无固定期限合同订立义务的前提下，
        公司已经提出以维持或提高原劳动合同条件续订，而你拒绝续订。
      - "这一事实可能使普通固定期限合同到期终止不产生经济补偿。"
    primary_warning: >
      先确认公司所谓"维持或提高条件"是否真实覆盖工资、岗位、地点、职级和其他核心劳动条件。
      仅保留工资数字但明显降低岗位、变更城市或取消主要待遇，
      不应被工具自动当作"维持原条件"。
    sections:
      - heading: "当前不支持的主张"
        paragraphs:
          - "在上述事实全部成立且没有无固定期限订立义务时，不应仅因公司没有继续留用而直接主张 N 或 2N。"

  - id: "C06"
    title: "规则命中：你已经实际连续履行两次固定期限劳动合同"
    findings:
      - "INDEFINITE_TERM_OBLIGATION_CANDIDATE"
      - "UNLAWFUL_TERMINATION_CANDIDATE"
    body:
      - >
        如果你在合同到期前或到期时提出或者同意续订，且没有劳动合同法规定的排除情形，
        公司可能负有与你订立无固定期限劳动合同的义务。
      - "在该义务存在的情况下，直接以合同期满为由不续签，可能形成违法终止候选。"
    primary_warning: >
      不要只把案件写成"合同到期，公司应当支付 N"。
      如果真正争点是公司是否应当订立无固定期限劳动合同，只主张普通经济补偿可能掩盖核心问题。
    sections:
      - heading: "仍需确认"
        items:
          - "续订意愿是否有书面证据"
          - "是否曾主动要求只签固定期限合同"
          - "公司是否主张严重违纪、医疗期满不能工作或不能胜任等排除情形"
      - heading: "不确定性"
        paragraphs:
          - "是否已经签过两次可以规则判断；是否构成违法终止仍依赖续订意愿、排除事由和证据。"

  - id: "C07"
    title: "规则命中：协商延长期限可能被视为第二次固定期限劳动合同"
    findings:
      - "DEEMED_SECOND_FIXED_TERM"
    body:
      - "你填写的日期显示，双方协商延长原劳动合同期限累计达到一年以上，且延长期限已经届满。"
      - "根据当前全国规则，这一情形应当进入\"连续订立二次固定期限劳动合同\"的审查路径。"
    primary_warning: >
      这项规则不是直接计算 2N 的公式。
      它只解决"是否视为第二次固定期限劳动合同"。
    sections:
      - heading: "下一步仍需判断"
        items:
          - "你是否提出或同意续订"
          - "你是否要求继续签固定期限"
          - "是否存在法定排除情形"
          - "公司最终是否违法终止"
      - heading: "当前不应主张"
        paragraphs:
          - "不要仅凭\"延长达到一年\"就向对方承诺案件一定属于 2N，也不要只按普通合同到期申报 N 而忽略无固定期限合同问题。"

  - id: "C08"
    title: "深圳规则命中：协商延长期限可能已被视为续订"
    findings:
      - "SZ_DEEMED_RENEWAL"
    body:
      - "你的主要劳动合同履行地在深圳，且双方协商延长劳动合同期限累计超过六个月。"
      - "深圳现行地方规则将这种情形视为续订劳动合同。"
      - >
        如果累计延长尚未达到一年，全国司法解释中的一年标准尚未同时命中；
        但深圳地方规则仍构成一项需要单独提出和审查的依据。
    primary_warning: >
      不要因为延长不足一年，就直接认定不存在第二次合同问题。
    sections:
      - heading: "仍需继续判断"
        items:
          - "深圳地方规则是否适用于你的劳动关系"
          - "续订后是否已经到期"
          - "你是否提出或者同意继续续订"
          - "是否存在无固定期限合同规则的排除情形"
          - "裁审机构如何处理地方规则与全国规则的并行适用"
      - heading: "不确定性"
        paragraphs:
          - "\"累计超过六个月\"属于可计算和规则判断；其最终对违法终止的影响仍需个案审查。"

  - id: "C09"
    title: "规则命中：自动续延可能构成第二次固定期限劳动合同"
    findings:
      - "DEEMED_SECOND_FIXED_TERM"
    body:
      - "原劳动合同约定期满后自动续延，双方也在原到期日后继续履行，现续延期限再次届满。"
      - "根据当前规则，这一情形应当进入\"连续订立二次固定期限劳动合同\"的审查路径。"
    primary_warning: >
      不要因为双方没有重新签一份纸质合同，就认定只有一次合同。
      自动续延条款和实际继续履行，可能改变合同次数判断。
    sections:
      - heading: "当前需要固定"
        items:
          - "包含自动续延条款的完整合同"
          - "原到期日"
          - "续延后的期限"
          - "到期后继续工作、发薪、考勤和管理的材料"
          - "续延后再次到期时的续订意愿"

  - id: "C10"
    title: "规则命中候选：变更签约主体可能不阻断合同次数"
    findings:
      - "ENTITY_CHANGE_DOES_NOT_RESET_COUNT"
    body:
      - >
        你并非因本人原因更换签约主体，但仍在原工作场所、原岗位或基本相同岗位工作，
        实际管理关系也持续存在。
      - >
        这可能被认定为用人单位通过变换劳动合同订立主体而继续用工，
        合同次数不能仅按每个主体分别清零。
    primary_warning: >
      不要只按营业执照上的公司名称分别计算合同，而忽略连续实际用工关系。
    sections:
      - heading: "当前需要证明"
        items:
          - "主体变更并非你主动申请"
          - "工作地点和岗位连续"
          - "汇报、考核、薪酬审批或业务管理持续"
          - "变更前后工作没有实质中断"
      - heading: "不确定性"
        paragraphs:
          - "主体名称和日期可以确认；\"继续进行劳动管理\"和岗位是否实质相同属于事实依赖问题。"

  - id: "C11"
    title: "裁量风险：存在规避无固定期限合同的候选行为"
    findings:
      - "GOOD_FAITH_AVOIDANCE_CANDIDATE"
    body:
      - >
        你填写的事实显示，公司可能通过个人辞职后立即重签、形式性短暂中断、
        反复改变合同名称或其他安排，使连续用工在文件上呈现为多段关系。
      - "这类情形可能进入\"其他违反诚信原则的规避行为\"审查。"
    primary_warning: >
      不要只保留最终一份劳动合同。
      需要把前后主体、岗位、管理关系、工作内容、薪酬支付和中断期间的实际工作情况连成完整时间线。
    sections:
      - heading: "当前不能给出的结论"
        paragraphs:
          - "本工具不能仅凭\"间隔很短\"或\"主体有关联\"就认定存在恶意规避。诚信判断高度依赖整体事实和裁审评价。"

  - id: "C12"
    title: "当前无法完成定性：续订意愿、排除事由或关键合同事实不清"
    findings: []
    body:
      - "你的合同结构可能触发二次固定期限或视同二次固定期限规则，但目前至少缺少以下一类关键事实："
    primary_warning: >
      在补齐这些事实前，不要把案件固定写成普通到期终止，也不要直接写成违法终止。
    sections:
      - heading: "缺少的关键事实"
        items:
          - "是否明确提出或者同意续订"
          - "是否要求继续签固定期限"
          - "是否存在严重违纪、医疗期满不能工作或不能胜任等排除事由"
          - "延长、自动续延或主体变更是否有原始材料"
      - heading: "当前建议"
        paragraphs:
          - "先固定续订表达和合同历史，再决定主张路径。工具不输出 N 或 2N 结论。"

  - id: "C13"
    title: "Warning：AI 替代、降本增效或内部缩编，不当然等于客观情况发生重大变化"
    findings:
      - "ARTICLE_40_3_CAUSE_NOT_ESTABLISHED_ALONE"
    body:
      - "公司给出的理由主要来自主动引入 AI、提高人效、降低成本、压缩团队或者内部调整。"
      - "这类理由可以解释公司为什么想减少岗位，但不能单独证明："
    primary_warning: >
      不要把讨论重点停留在"AI 能不能完成我的工作"。
    sections:
      - heading: "不能单独证明的事项"
        items:
          - "变化来自公司控制范围之外"
          - "原劳动合同已经客观无法履行"
          - "公司已穷尽合理的合同变更协商"
      - heading: "更关键的问题"
        items:
          - "原工作是否仍由其他人员继续完成"
          - "公司是否仍有适配岗位"
          - "是否向你提出过具体、合理的变更方案"
          - "公司是否只谈离职补偿"
      - heading: "当前定性"
        paragraphs:
          - "存在违法解除候选，但仍需结合岗位实际灭失、内部用工情况和协商过程审查。"

  - id: "C14"
    title: "关键前置程序缺失候选：双方谈的是离职，不是合同变更"
    findings:
      - "ARTICLE_40_3_CONSULTATION_GAP"
      - "UNLAWFUL_TERMINATION_CANDIDATE"
    body:
      - >
        你填写的事实显示，公司解除前没有提出具体岗位，
        或者只讨论了补偿、离职日期，又或者仅要求你自行查看内部招聘信息。
      - "这些沟通不能由工具自动等同于：用人单位与劳动者就变更劳动合同内容进行协商，未能达成协议。"
    primary_warning: >
      "谈过话"不等于"谈过如何继续履行劳动合同"。
      真正需要核对的是，公司是否明确提出过岗位、职责、工资、地点和生效时间，并给予你真实回应机会。
    sections:
      - heading: "当前定性"
        paragraphs:
          - "第 40 条第 3 项的协商前置条件存在明显缺口候选，违法解除风险较高，但最终仍需审查完整沟通记录。"

  - id: "C15"
    title: "事实与裁量问题：公司提出了方案，但不等于完成了合理协商"
    findings:
      - "ARTICLE_40_3_OFFER_REASONABLENESS_DISPUTED"
    body:
      - >
        公司确实提出过具体岗位，但该方案可能包含明显降薪、降级、跨城市、
        显著增加通勤或者与原技能严重不匹配等变化。
      - >
        法律没有一个可以机械适用于所有案件的固定降薪比例。
        本工具不会把"降低多少百分比"直接换算成解除是否成立。
    primary_warning: >
      不要只回复"我不同意调岗"。
      应当保存并说明拒绝的具体原因。
    sections:
      - heading: "应当保存并说明的拒绝理由"
        items:
          - "工资和职级变化"
          - "工作地点和通勤成本"
          - "岗位职责与专业能力"
          - "公司是否提供培训"
          - "你提出过哪些替代方案"
      - heading: "当前定性"
        paragraphs:
          - "协商是否真实、方案是否合理以及拒绝是否有正当理由，属于事实依赖和裁判裁量问题。"
    deviation_note: >
      规格书原文为"本工具不会把'降低多少百分比'直接换算成合法或违法"。
      "合法"在此处是断言式搭配，触发 §6.5 禁止表达守卫，
      故改写为"直接换算成解除是否成立"，语义不变。见 open-questions Q8。

  - id: "C16"
    title: "在当前覆盖范围内，暂未发现第 40 条第 3 项的明显缺口"
    findings:
      - "ARTICLE_40_3_NO_CONFLICT_FOUND_WITHIN_COVERAGE"
    body:
      - "你填写的事实显示："
    primary_warning: >
      这不是对解除的合规确认。本工具没有完整审查公司证据真实性、工会通知、
      受特殊保护人员、是否实际上属于经济性裁员、公司是否选择性裁减、
      解除通知的送达和其他程序，以及地方裁判差异。
    sections:
      - heading: "你填写的事实显示"
        items:
          - "发生了可能超出公司一般自主经营调整的客观变化"
          - "原劳动合同可能已经无法继续履行"
          - "公司提出过具体且核心条件基本相当的变更方案"
          - "双方进行过真实协商但未达成协议"
          - "公司履行了提前 30 日书面通知或额外支付一个月工资"
      - heading: "本工具没有完整审查"
        items:
          - "公司证据真实性"
          - "工会通知"
          - "受特殊保护人员"
          - "是否实际上属于经济性裁员"
          - "公司是否选择性裁减"
          - "解除通知的送达和其他程序"
          - "地方裁判差异"
      - heading: "当前表述"
        paragraphs:
          - "只能说：在本工具当前覆盖的第 40 条第 3 项规则内，暂未发现明显冲突。"
    deviation_note: >
      规格书原文的"重要说明"首句为「这不是"合法解除通过检查"。」，
      其中"通过检查"是 §6.5 明令禁止的表达。
      按 CLAUDE.md §P4 守卫测试不设豁免，改写为"这不是对解除的合规确认"。
      见 open-questions Q8。

  - id: "C17"
    title: "证据 Warning：公司当时使用的解除理由不清晰"
    findings: []
    body:
      - "公司没有在解除时明确给出理由，或者直到解除后、仲裁后才首次提出具体理由。"
      - "事后提出的解释，与解除当时已经存在并向劳动者表达的理由，并不是同一项事实材料。"
    primary_warning: >
      立即固定解除通知原件及公司最初表述，不要用事后沟通覆盖原始版本。
    sections:
      - heading: "当前定性"
        paragraphs:
          - "解除依据存在证据缺口候选。是否因此构成违法解除，仍要结合通知文本、送达过程、公司举证和当地裁判规则判断。"

  - id: "C18"
    title: "自动判断暂停：当前案件出现本工具未覆盖的重要规则"
    findings: []
    body:
      - "你的情况涉及以下一项或多项："
    primary_warning: >
      不要用本工具其他分支的结论类推当前案件。
    sections:
      - heading: "未覆盖情形"
        items:
          - "医疗期、孕期产期哺乳期、工伤或其他法定续延"
          - "劳动合同法第三十九条"
          - "第四十条第一项或第二项"
          - "无固定期限合同"
          - "以完成任务为期限的合同"
          - "2025 年 9 月 1 日前已经完成的操作"
          - "主要履行地无法确定"
          - "已签署退出文件"
          - "其他超出当前三项规则支点的问题"
      - heading: "当前建议"
        paragraphs:
          - "导出已填写事实，保留原始文件，在下一次签字、回复或提交请求前进行专业复核。"
    deviation_note: >
      round3 编者按第 2 点：原清单中"到期后继续工作超过一个月"一项已删除，
      该情形升格为核心规则（《解释二》第十一条），对应 C20/C21/C22。

  - id: "C19"
    title: "当前无法形成可靠候选"
    findings: []
    body:
      - "你填写的部分事实互相冲突，或者缺少决定性信息。例如："
    primary_warning: >
      不要为了得到一个确定结论而猜测答案。
    sections:
      - heading: "冲突或缺失的例子"
        items:
          - "既选择\"没有书面通知\"，又填写了书面通知理由"
          - "既表示拒绝续订，又要求认定公司拒绝签无固定期限合同"
          - "无法确定合同次数、延长日期或签约主体"
          - "公司是否仍提供工作无法判断"
      - heading: "当前建议优先核对"
        items:
          - "完整劳动合同及补充协议"
          - "解除或不续签通知"
          - "续订意愿记录"
          - "调岗和补偿沟通"
          - "实际停止工作的时间"
      - heading: "本工具的边界"
        paragraphs:
          - "本工具不会在关键事实缺失时输出 N、2N 或者解除已经成立的结论。"
    deviation_note: >
      规格书原文末句为"本工具不会在关键事实缺失时输出 N、2N 或者'合法解除'"。
      "合法"为断言式搭配，改写为"解除已经成立的结论"。见 open-questions Q8。

  - id: "C20"
    title: "规则命中：劳动合同期满后可能已经进入拟制续订状态"
    findings:
      - "DEEMED_RENEWAL_CANDIDATE"
    body:
      - "你填写的事实显示："
      - "根据当前规则，你可以重点评估是否请求用人单位按照原劳动合同条件续订劳动合同。"
    primary_warning: >
      不要再把劳动关系结束日期当然写成原劳动合同到期日。
      如果合同到期后双方仍持续安排工作、考勤、发薪和接受管理，真正需要审查的可能是：
      公司后来在什么时间、以什么理由结束了继续存续的劳动关系。
    sections:
      - heading: "你填写的事实显示"
        items:
          - "固定期限劳动合同已经到期"
          - "到期后你仍然继续正常工作"
          - "用人单位未表示异议超过一个月"
      - heading: "现在应当固定"
        items:
          - "原劳动合同及到期日期"
          - "到期后的考勤记录"
          - "到期后的工资支付记录"
          - "到期后公司安排的任务"
          - "公司首次表示不同意继续工作的具体日期和原文"
      - heading: "不确定性"
        paragraphs:
          - "\"是否超过一个月\"可以根据日期计算。"
          - "\"是否属于继续正常工作\"以及公司是否已经通过明确行为表示异议，仍可能依赖个案事实。"

  - id: "C21"
    title: "规则叠加：可能有权请求按照原条件订立无固定期限劳动合同"
    findings:
      - "INDEFINITE_TERM_UNDER_ORIGINAL_CONDITIONS_CANDIDATE"
    body:
      - "你填写的事实同时显示："
      - >
        在这些事实成立的情况下，
        可以重点评估是否请求用人单位按照原劳动合同条件订立无固定期限劳动合同。
    primary_warning: >
      不要只把案件表述为普通合同到期并要求经济补偿。
    sections:
      - heading: "你填写的事实同时显示"
        items:
          - "劳动合同期满后继续工作"
          - "用人单位未表示异议超过一个月"
          - "你可能已经符合订立无固定期限劳动合同的条件"
      - heading: "真正的核心争点可能是"
        items:
          - "劳动关系是否已经拟制续订"
          - "用人单位是否负有订立无固定期限劳动合同的义务"
          - "公司后来结束劳动关系属于何种解除"
          - "应当选择继续履行还是赔偿金"
      - heading: "当前不应直接主张"
        items:
          - "不应仅凭\"继续工作超过一个月\"直接断言一定获得 2N"
          - "不应把继续履行和赔偿金作为可以同时累加的最终法律后果"
          - "不应忽略劳动者本人是否愿意续订以及是否存在法定排除事由"

  - id: "C22"
    title: "当前更接近：劳动关系续存后的解除，而不是原到期日自然终止"
    findings:
      - "SUBSEQUENT_TERMINATION_CONSEQUENCES_REVIEW"
    body:
      - "你填写的事实显示："
      - "这次操作不宜直接按照原劳动合同到期日处理。"
    primary_warning: >
      不要在仲裁申请中只写"劳动合同到期，公司不再续签"。
      这种写法可能遗漏合同到期后继续用工以及后来解除这两个关键事实。
    sections:
      - heading: "你填写的事实显示"
        items:
          - "原固定期限劳动合同到期后，你继续正常工作"
          - "用人单位未表示异议超过一个月"
          - "此后用人单位又通知你停止工作或者离开公司"
      - heading: "需要进一步审查"
        items:
          - "公司后来解除劳动关系的具体日期"
          - "公司当时写明的解除理由"
          - "该理由是否具备法律依据"
          - "公司是否履行相应程序"
          - "你选择继续履行还是赔偿金路径"
      - heading: "当前结论"
        paragraphs:
          - "《劳动争议解释二》第十一条支持将公司后续行为放入解除法律后果中审查，但本规则本身不直接证明该解除必然违法。"
