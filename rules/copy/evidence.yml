# 证据固定清单 —— 两栏结构。全部照抄规格书 round2 §9。
#
# 左栏「现在还能取得或主动形成」，右栏「解除后很可能难以取得」。
# 这张表的全部意义在于对比"现在能拿"与"以后拿不到"，
# 因此两栏都不得为空（由 EvidenceChecklist schema 强制）。

checklists:
  - id: "P01"
    title: "合同到期与续订路径"
    currently_available:
      - "全部劳动合同及补充协议，不只保存最后一份"
      - "原到期日、延长协议、自动续延条款"
      - "书面表达续订或继续工作的邮件、微信"
      - "公司不续签通知及送达记录"
      - "变更签约主体的通知、协议和原因"
      - "到期后继续工作的考勤、发薪和工作成果"
      - "原岗位、地点、汇报关系连续的材料"
    at_risk_after_exit:
      - "公司邮箱中的续签审批、HR 往来及历史附件"
      - "HR 系统里的合同版本和续签流程状态"
      - "内部组织架构、岗位编制和同岗位人员名单"
      - "内部招聘页面及相近岗位信息"
      - "变更前后实际管理、考核、工资审批流程"
      - "企业 IM、知识库、工单系统和项目历史"
      - "能显示工作不中断的内部项目记录"

  - id: "P02"
    title: "AI 替岗、团队缩编与第 40 条第 3 项"
    currently_available:
      - "解除通知原件及全部版本"
      - "公司最初给出的书面理由"
      - "原岗位说明、劳动合同中的工作内容"
      - "公司提出的每一份调岗方案"
      - "与岗位、工资、地点、职责有关的沟通"
      - "你对调岗方案的回复和替代建议"
      - "仅谈补偿而未谈岗位的记录"
      - "历史绩效、OKR、项目评价"
    at_risk_after_exit:
      - "内部组织调整、岗位撤销和 AI 项目通知"
      - "调整前后的组织架构、人员名单"
      - "仍在招聘或保留的相近岗位"
      - "内部岗位库、薪酬级别和岗位权限"
      - "Jira、飞书、钉钉、Slack、内部 Wiki 中的项目分工"
      - "Git 仓库中的 commit、PR、review 和任务记录"
      - "能证明原工作仍由同事、外包或新员工完成的材料"
      - "解除后被关闭的邮箱、云盘和内部系统"

  - id: "P03"
    title: "事实解除路径"
    currently_available:
      - "权限被关闭的页面、时间和账号信息"
      - "公司拒绝入场、拒绝安排工作的文字"
      - "公司要求交还设备或停止工作的通知"
      - "书面表达仍愿意工作的消息"
      - "每日到岗、待命或请求安排工作的记录"
      - "工资停发、考勤异常记录"
    at_risk_after_exit:
      - "账号后台状态及权限变更记录"
      - "门禁、考勤和工位安排记录"
      - "工作群、项目群及被移除记录"
      - "内部任务和汇报系统"
      - "同事对公司统一安排的直接材料"
      - "企业邮箱和内部聊天完整历史"

  - id: "P04"
    title: "协商解除路径"
    at_risk_column_title: "签署后很难恢复或推翻的内容"
    currently_available:
      - "公司最初提出解除的邮件、聊天和会议纪要"
      - "每一版协议草案"
      - "公司要求提交个人辞职的记录"
      - "报价、付款时间和付款条件"
      - "你提出的异议和保留意见"
    at_risk_after_exit:
      - "谁先提出解除的原始沟通"
      - "草案修订记录和文件元数据"
      - "签署过程中的口头承诺"
      - "被最终协议\"整合\"掉的早期方案"
      - "签署后系统权限和内部沟通记录"

# 程序员专属证据边界提示 —— 结果页固定显示。round2 §9。
boundary_notice:
  - "只保存与本人劳动关系、岗位、绩效和解除事实具有必要关联的材料。"
  - >
    不要绕过权限控制，不要使用他人账号，
    不要批量复制源代码、客户数据、模型权重、密钥、商业秘密或与案件无关的公司文件。
  - "证据固定不等于可以无限制下载公司数据。"
