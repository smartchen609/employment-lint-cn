# 《解释二》第十条第一项 —— 协商延长期限累计达到一年以上
# 来自 round2 §11.3，字段名按 round3 改写（provision_effective / jurisdiction）。
#
# 本规则只解决**合同次数**问题。是否产生订立无固定期限劳动合同义务、
# 是否构成违法终止，一律由后续规则继续审查。round2 §3.1。

id: "CN-NAT-SPC-LABOR-II-10-1"
version: "1.0.0"
status: "active"

title: "协商延长劳动合同期限累计达到一年以上"
description: >
  用人单位与劳动者协商延长固定期限劳动合同期限，
  累计达到一年以上且延长期限届满的，
  进入连续订立二次固定期限劳动合同审查路径。

jurisdiction:
  country: "CN"
  level: "national"

priority: 100
overrides: []

provision_effective:
  from: "2025-09-01"
  to: null

authority_type: "judicial-interpretation"
uncertainty: "rule-based"
severity: "warning"

legal_basis:
  - source_id: "SPC-LABOR-II-2025"
    instrument: "最高人民法院关于审理劳动争议案件适用法律问题的解释（二）"
    document_no: "法释〔2025〕12号"
    article: "第十条第一项"
  - source_id: "CN-LCL-2012"
    instrument: "中华人民共和国劳动合同法"
    article: "第十四条第二款第三项"

conditions:
  all:
    - fact: "contract.type"
      operator: "equals"
      value: "FIXED_TERM"

    - fact: "contract.extension.nature"
      operator: "equals"
      value: "NEGOTIATED"

    - derived_fact: "contract.extension.cumulative_calendar_months"
      operator: "greater_than_or_equal"
      value: 12

    - fact: "contract.extension.period_expired"
      operator: "equals"
      value: true

findings:
  classification_candidates:
    - "DEEMED_SECOND_FIXED_TERM"
  headline: "协商延长期限可能被视为第二次固定期限劳动合同"
  explanation: >
    该规则只解决合同次数问题。
    是否产生订立无固定期限劳动合同义务以及是否构成违法终止，
    仍需继续审查续订意愿、固定期限选择和法定排除事项。

claim_guidance:
  recommended:
    - "继续审查无固定期限劳动合同订立义务"
  do_not_claim:
    - "不得仅凭本规则直接输出违法终止赔偿金"
    - "不得仅凭本规则输出继续履行"
  review_required: false

evidence:
  required:
    - id: "ORIGINAL_CONTRACT"
      label: "原固定期限劳动合同"
    - id: "EXTENSION_AGREEMENTS"
      label: "每次协商延长的协议或书面记录"
    - id: "ORIGINAL_AND_EXTENDED_EXPIRY_DATES"
      label: "原到期日及延长后的到期日"

  supporting:
    - id: "HR_EXTENSION_EMAIL"
      label: "人事关于延长期限的邮件或企业IM记录"

  contrary:
    - id: "STATUTORY_EXTENSION"
      label: "证明属于法定自动续延而非双方协商延长的材料"

  at_risk_after_exit:
    - id: "INTERNAL_CONTRACT_WORKFLOW"
      label: "内部合同审批和续签流程"

exceptions:
  - id: "EXTENSION_NOT_NEGOTIATED"
    description: "延长属于医疗期等法定自动续延"
    effect: "block"

last_reviewed_at: "2026-09-03"

tests:
  - "T04"
  - "T05"
