    verification_record: >
      2026-09-04 核对（深圳市人力资源和社会保障局政府信息公开平台原文页）：
      附则第七十二条「本条例自2008年11月1日起施行」——
      证实 round3 §0 的结论，provision_effective.from 应为 2008-11-01。
      标题下括注「根据2019年4月24日深圳市第六届人民代表大会常务委员会
      第三十三次会议《关于修改〈深圳经济特区医疗条例〉等二十七项法规的决定》修正」，
      该次修正未改动第十八条第二款。
      第十八条第二款原文「用人单位与劳动者协商延长劳动合同期限累计超过六个月的，
      视为续订劳动合同」，与本项目登记的 quote 逐字一致。
      注：核验过程中发现某商业法律数据库将本条例「施行日期」标为 2019-04-26，
      正是 round3 警告的那类混淆；本项目 provision_effective 与
      instrument_history 分离的设计挡住了该错误。

