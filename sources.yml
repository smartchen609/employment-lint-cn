# 来源注册表 —— 本项目唯一的 URL 与核验状态登记处。
#
# 规则文件中只写 legal_basis[].source_id，不重复维护 URL。round3 §8。
#
# ## 纪律（CLAUDE.md §L1 §L3 §L4）
#
# 1. 本文件中的法条名称、条文编号、生效日期、URL，一律只能来自规格书，
#    或由维护人核验后提供。**不得由 AI 凭记忆或推测补全。**
#
# 2. page_opened_and_checked 只能由维护人置为 true，
#    含义是"亲自打开官方原文页，核对过页面标题、制定机关、条文、
#    施行日期和修改沿革"。构建校验对此不放行。
#    tests/schema.test.ts 中的 MAINTAINER_VERIFIED 清单与本文件互为校验。
#
# 3. verification_record 记录**核验到了什么**，而不只是"核过了"。
#    一个布尔值说明不了核验深度；写下看到的条文和日期，
#    第三方才能复核这次核验本身。
#
# 4. round2 脚注 [4]、[6] 已确认为无效引用（条文内容正确但出处对不上），
#    禁止使用，故不在本文件中登记。见 docs/sources-to-verify.md「禁止使用」。

