    page_opened_and_checked: true
    last_verified_at: "2026-09-04"
    verified_by: "apangchen"
    status: "active"
    note: >
      仲裁时效依据。由维护人于 2026-09-03 指定中国人大网法律全文页为官方来源，
      URL 已去除追踪参数。
      **四款必须整体登记，不得只录第一款**：
      第一款为一年时效及"知道或者应当知道其权利被侵害之日"起算点；
      第二款中断（向对方主张权利、向有关部门请求救济、对方同意履行，中断后重新计算）；
      第三款中止（不可抗力或其他正当理由，原因消除后继续计算）；
      第四款拖欠劳动报酬特别规则（劳动关系存续期间不受一年限制，
      终止后自终止之日起一年内提出）。
      第二、三款是防止本工具机械输出"超过一年即失效"的结构性约束，
      与 round2 §7 R06 的措辞纪律直接对应。
