#
# ## 纪律（CLAUDE.md §L1 §L3 §L4）
#
# 1. 本文件中的法条名称、条文编号、生效日期、URL，一律只能来自规格书。
#    规格书没有给出的，写 "TODO_VERIFY"，并在 docs/sources-to-verify.md 登记。
#    **不得由 AI 凭记忆或推测补全。**
#
# 2. page_opened_and_checked 一律先写 false。
#    只有维护人亲自打开官方原文页，核对页面标题、制定机关、条文、
#    施行日期和修改沿革之后，才可改为 true，并同时填写
#    last_verified_at 与 verified_by。
#    **构建校验对此不放行；AI 不得为了让构建通过而改成 true。**
#
# 3. round2 脚注 [4]、[6] 已确认为无效引用（条文内容正确但出处对不上），
#    禁止使用，故不在本文件中登记。见 docs/sources-to-verify.md「禁止使用」。

